[package]
name = "llm-provider-macros"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The #[tool] and #[tools] attribute macros of llm-provider"
repository.workspace = true
documentation = "https://docs.rs/llm-provider-macros"
keywords = ["llm", "agent", "tool", "macro"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild.workspace = true
