name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.LLM_PROVIDER_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - id: release
        uses: release-plz/action@v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.LLM_PROVIDER_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
