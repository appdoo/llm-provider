[package]
name = "llm-provider"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "A small, pure-Rust toolbox for LLM agents: Anthropic and OpenAI-compatible providers, an agent loop and sandboxed file tools"
repository.workspace = true
readme = "README.md"
keywords = ["llm", "anthropic", "openai", "agent", "claude"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "llm_provider"

[features]
default = []
schema = ["dep:schemars"]
agent = ["schema", "dep:futures", "dep:llm-provider-macros"]
batch = []
fs-tools = ["agent", "dep:glob", "dep:regex", "dep:tempfile", "dep:walkdir"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "fs", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
async-trait.workspace = true
tokio-stream = { workspace = true, features = ["io-util"] }
async-stream = "0.3"
tokio-util = "0.7"
bytes = "1"
memchr = "2"
backon = { version = "1.6", default-features = false, features = ["std"] }
secrecy.workspace = true
schemars = { version = "1.2", optional = true }
futures = { workspace = true, optional = true }
llm-provider-macros = { workspace = true, optional = true }
glob = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
tempfile = { workspace = true, optional = true }
walkdir = { version = "2.5", optional = true }

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
trybuild.workspace = true

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "ask"

