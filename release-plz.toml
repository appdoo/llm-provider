[workspace]
# Releases publish to crates.io (CARGO_REGISTRY_TOKEN) and tag on GitHub.
git_only = false
# Releases happen only when a release PR is merged, never on a version bump
# that arrives in a feature PR.
release_always = false

[changelog]
# Only the heading line, with its compare link: release-plz adds no commit
# subjects. The hand-written [Unreleased] text becomes the release's notes, and
# RELEASE.md step 3 is where the owner reads it.
body = """

## [{{ version | trim_start_matches(pat="v") }}]\
{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}

"""

# The core and its macros are released together: the macros are versioned
# with llm-provider, which depends on them at the same version.
[[package]]
name = "llm-provider"
version_group = "llm-provider"

[[package]]
name = "llm-provider-macros"
version_group = "llm-provider"
# Its changes are listed in crates/llm-provider/CHANGELOG.md, under llm-provider.
changelog_update = false

# The tools crate re-exposes core's traits, so a breaking core release is a
# breaking tools release: it joins the version group. Each crate keeps its
# changelog in its own directory, where release-plz looks by default.
[[package]]
name = "llm-provider-tools"
version_group = "llm-provider"
