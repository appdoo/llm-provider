[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = [
  # chrono is unmaintained, not vulnerable. It comes only through rmcp (the
  # official MCP SDK), which needs it directly and through schemars' chrono04.
  # Remove when rmcp drops chrono.
  { id = "RUSTSEC-2026-0543", reason = "transitive via rmcp; unmaintained, not a vulnerability" },
]
