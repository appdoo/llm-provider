[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/appdoo/llm-provider"

[workspace.dependencies]
llm-provider = { version = "0.3.0", path = "crates/llm-provider" }
llm-provider-macros = { version = "0.3.0", path = "crates/llm-provider-macros" }
async-trait = "0.1"
futures = "0.3"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.9.0", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
trybuild = "1"
url = "2"
