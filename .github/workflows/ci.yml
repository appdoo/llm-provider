name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo clippy -p llm-provider --all-targets -- -D warnings
      - run: cargo build -p llm-provider
      - run: cargo build -p llm-provider --features agent
      - run: cargo build -p llm-provider --features fs-tools
      - run: cargo run -p llm-provider --example sandbox --features fs-tools
      - run: cargo test -p llm-provider
      - run: cargo test -p llm-provider --features agent
      - run: cargo test -p llm-provider --features fs-tools
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo build -p llm-provider
      - run: cargo build -p llm-provider --features agent
      - run: cargo build -p llm-provider --features fs-tools
      - run: cargo test --workspace --all-features

  security:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
      CARGO_DENY_VERSION: "0.20.2"
      # renovate: datasource=github-releases depName=google/osv-scanner
      OSV_SCANNER_VERSION: "2.7.0"
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: "8.30.1"
      # renovate: datasource=pypi depName=semgrep
      SEMGREP_VERSION: "1.184.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          curl -fsSL -o "$HOME/.local/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          pip install "semgrep==${SEMGREP_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/security.sh

  semver:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The released crates with a Rust API; the proc-macro crate has none
        # that semver-checks reads, and is versioned with llm-provider.
        package: [llm-provider, llm-provider-tools]
    env:
      # renovate: datasource=crate depName=cargo-semver-checks
      SEMVER_CHECKS_VERSION: "0.51.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0 --match '${{ matrix.package }}-v*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Install cargo-semver-checks
        if: steps.tag.outputs.tag != ''
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v${SEMVER_CHECKS_VERSION}/cargo-semver-checks-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cargo semver-checks
        if: steps.tag.outputs.tag != ''
        run: cargo semver-checks -p ${{ matrix.package }} --baseline-rev ${{ steps.tag.outputs.tag }}
